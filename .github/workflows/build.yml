- name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/yoramvandevelde/recipit:latest
            ghcr.io/yoramvandevelde/recipit:${{ github.sha }}

      - name: Update gitops repo
        uses: actions/checkout@v4
        with:
          repository: yoramvandevelde/k3s-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: k3s-gitops

      - name: Update image tag
        run: |
          sed -i 's|ghcr.io/yoramvandevelde/recipit:.*|ghcr.io/yoramvandevelde/recipit:${{ github.sha }}|' \
            k3s-gitops/apps/recipit/base/recipit.yaml
          cd k3s-gitops
          git config user.email "ci@github"
          git config user.name "GitHub Actions"
          git add apps/recipit/base/recipit.yaml
          git commit -m "chore: update recipit to ${{ github.sha }}"
          git push
